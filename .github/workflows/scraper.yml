name: Padel Cloud Scraper

on:
  schedule:
    - cron: '0 * * * *' # Läuft jede volle Stunde
  workflow_dispatch: # Erlaubt manuellen Start per Klick

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Scraper ausführen
        run: python scraper.py

      - name: CSV automatisch speichern & aktualisieren
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add court_availability.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Neue Scraper-Daten [skip ci]" && git push)
